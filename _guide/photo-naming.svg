<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F3A5F"/></marker></defs><rect width="960" height="300" fill="#fff"/>
<text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1E2A26">How a gallery photo gets its date and caption</text>
<rect x="60" y="80" width="840" height="56" rx="8" fill="#F3F5F8" stroke="#DDE3EA"/>
<text x="90" y="117" font-size="22" font-weight="700" fill="#1F3A5F" font-family="Menlo, monospace">2026-07-04</text>
<text x="223.0" y="117" font-size="22" font-weight="700" fill="#5B6B64" font-family="Menlo, monospace">-</text>
<text x="236.3" y="117" font-size="22" font-weight="700" fill="#C8663F" font-family="Menlo, monospace">receiving-first-place-at-bioconnect</text>
<text x="701.8" y="117" font-size="22" font-weight="700" fill="#5B6B64" font-family="Menlo, monospace">.jpg</text>
<text x="160" y="175" text-anchor="middle" font-size="13" fill="#1F3A5F" font-weight="700">date (day optional)</text><text x="160" y="193" text-anchor="middle" font-size="12" fill="#5B6B64">sorts the photo and shows "4 July 2026"</text>
<text x="560" y="175" text-anchor="middle" font-size="13" fill="#C8663F" font-weight="700">caption, words joined by hyphens</text><text x="560" y="193" text-anchor="middle" font-size="12" fill="#5B6B64">becomes "Receiving first place at bioconnect"</text>
<text x="480" y="240" text-anchor="middle" font-size="13" fill="#5B6B64">Helper 3 does the naming for you and removes hidden location data from phone photos.</text>
<text x="480" y="262" text-anchor="middle" font-size="13" fill="#5B6B64">Story lines go in the chapter's beats.txt, e.g.   2026-07 | First place at BioConnect 2026.</text>
</svg>