project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!HOW_TO_EDIT.md"

website:
  title: "Halireena"
  site-url: https://halireena.github.io
  description: "Portfolio, projects and writing."
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/halireena
        aria-label: GitHub
  page-footer:
    center: "© 2026 Halireena · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
