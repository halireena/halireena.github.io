project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!HOW_TO_EDIT.md"

website:
  title: "Halireena Mohomed"
  site-url: https://halireena.github.io
  description: "Plant scientist moving into bioinformatics: crop disease, genomics and honest data analysis."
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/halireena
        aria-label: GitHub
  page-footer:
    center: "Made with 💚 by Halireena (Rush) · Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-title: "On this page"
    smooth-scroll: true
    fig-align: center
