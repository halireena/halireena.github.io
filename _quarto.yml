project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!HOW_TO_EDIT.md"

website:
  title: "Halireena Mohomed"
  site-url: https://halireena.github.io
  description: "Plant scientist moving into bioinformatics: crop disease, genomics and honest data analysis."
  favicon: images/favicon.svg
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: cv.qmd
        text: CV
    right:
      - text: LinkedIn
        href: https://www.linkedin.com/in/halireena
        aria-label: LinkedIn
      - text: GitHub
        href: https://github.com/halireena
        aria-label: GitHub
      - href: contact.qmd
        text: Contact
  page-footer:
    left: "© 2026 Halireena Mohomed"
    right: "[LinkedIn](https://www.linkedin.com/in/halireena) · [GitHub](https://github.com/halireena) · [Contact](/contact.html)"

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: true
    toc-title: "On this page"
    smooth-scroll: true
    fig-align: center
    include-after-body:
      text: |
        <script>document.querySelectorAll('.navbar a.nav-link').forEach(a=>{ if (a.textContent.trim()==='Contact') a.classList.add('contact-btn'); });</script>
