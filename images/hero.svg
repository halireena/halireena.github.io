<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-label="Illustration of a little drone flying over a potato leaf with a DNA helix">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6C9C4"/><stop offset="1" stop-color="#CDBDF0"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9CC69F"/><stop offset="1" stop-color="#6E9B76"/></linearGradient>
  </defs>
  <path d="M60 120 C 40 40, 200 10, 280 50 C 380 90, 420 200, 360 300 C 300 390, 120 400, 70 310 C 30 240, 75 190, 60 120 Z" fill="url(#g1)" opacity=".85"/>
  <circle cx="340" cy="70" r="26" fill="#FBE6A6"/>
  <!-- leaf -->
  <g transform="translate(95 170) rotate(-12)">
    <path d="M0 110 C 10 30, 110 -10, 200 20 C 190 110, 110 160, 0 110 Z" fill="url(#leaf)" stroke="#2F4A3A" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 110 C 60 80, 120 50, 196 22" fill="none" stroke="#2F4A3A" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 82 L 70 50 M100 62 L 118 34 M140 45 L 160 26 M70 80 L 110 100 M115 58 L 150 78" stroke="#2F4A3A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="118" cy="88" r="9" fill="#D9837B" stroke="#2F4A3A" stroke-width="3"/>
    <circle cx="142" cy="70" r="6" fill="#D9837B" stroke="#2F4A3A" stroke-width="3"/>
    <!-- cute face -->
    <circle cx="70" cy="98" r="4" fill="#2F4A3A"/><circle cx="92" cy="90" r="4" fill="#2F4A3A"/>
    <path d="M74 108 Q 84 114 92 104" fill="none" stroke="#2F4A3A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="62" cy="108" r="5" fill="#F6C9C4"/><circle cx="102" cy="96" r="5" fill="#F6C9C4"/>
  </g>
  <!-- scan beam -->
  <path d="M210 128 L 150 230 L 280 230 Z" fill="#FFFBF5" opacity=".55"/>
  <!-- drone -->
  <g transform="translate(160 70)">
    <rect x="20" y="40" width="60" height="26" rx="12" fill="#FFFBF5" stroke="#2F4A3A" stroke-width="4"/>
    <circle cx="50" cy="53" r="7" fill="#BFE0EC" stroke="#2F4A3A" stroke-width="3"/>
    <path d="M20 48 L 0 36 M80 48 L 100 36" stroke="#2F4A3A" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="32" rx="22" ry="5" fill="#CDBDF0" stroke="#2F4A3A" stroke-width="3"/>
    <ellipse cx="100" cy="32" rx="22" ry="5" fill="#CDBDF0" stroke="#2F4A3A" stroke-width="3"/>
    <path d="M42 66 L 38 76 M58 66 L 62 76" stroke="#2F4A3A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- DNA helix -->
  <g transform="translate(330 150)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M0 0 C 30 20, 30 40, 0 60 C -30 80, -30 100, 0 120 C 30 140, 30 160, 0 180" stroke="#D9837B"/>
    <path d="M0 0 C -30 20, -30 40, 0 60 C 30 80, 30 100, 0 120 C -30 140, -30 160, 0 180" stroke="#2F4A3A"/>
    <path d="M-17 30 H 17 M-17 90 H 17 M-17 150 H 17" stroke="#6E9B76" stroke-width="3"/>
  </g>
  <!-- sparkles -->
  <g fill="#2F4A3A">
    <path d="M60 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M300 330 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M120 330 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
  </g>
</svg>
