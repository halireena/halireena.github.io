<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Nunito, Helvetica, Arial, sans-serif" role="img" aria-label="Illustration of the workflow: leaf sample, DNA extraction, PCR of the rbcL gene, gel electrophoresis">
  <rect width="900" height="340" rx="10" fill="#FFFFFF"/>
  <g stroke="#1E2A26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" font-weight="700" font-size="17" fill="#1E2A26" text-anchor="middle">
    <g transform="translate(40 50)"><rect width="170" height="200" rx="24" fill="#EEF4F0"/>
      <path d="M85 150 V 110 M85 115 C 60 112 45 90 48 62 C 75 65 85 85 85 115 Z M85 110 C 110 107 125 85 122 57 C 95 60 85 80 85 110 Z" fill="#7FA894"/>
      <text x="85" y="185" stroke="none">Leaf sample</text></g>
    <g transform="translate(250 50)"><rect width="170" height="200" rx="24" fill="#F2F6F4"/>
      <path d="M70 45 H 100 V 120 C 100 140 70 140 70 120 Z" fill="#FFFFFF"/><path d="M70 100 H 100" />
      <text x="85" y="185" stroke="none">DNA extraction</text></g>
    <g transform="translate(460 50)"><rect width="170" height="200" rx="24" fill="#E8F0EC"/>
      <path d="M50 120 C 70 60 100 60 120 120" fill="none"/><path d="M50 60 C 70 120 100 120 120 60" fill="none" stroke="#A8483B"/>
      <text x="85" y="170" stroke="none">PCR of</text><text x="85" y="190" stroke="none" font-style="italic">rbcL</text></g>
    <g transform="translate(670 50)"><rect width="190" height="200" rx="24" fill="#E3EBE7"/>
      <rect x="35" y="30" width="120" height="110" rx="10" fill="#FFFFFF"/>
      <g stroke-width="7"><path d="M50 55 H 70 M85 55 H 105 M120 55 H 140 M50 85 H 70 M85 90 H 105 M120 85 H 140 M50 115 H 70 M120 120 H 140"/></g>
      <text x="95" y="185" stroke="none">Gel electrophoresis</text></g>
    <path d="M213 150 H 245 M423 150 H 455 M633 150 H 665" fill="none" stroke-width="4"/>
  </g>
  <text x="450" y="300" text-anchor="middle" font-size="14" fill="#8A968F">illustration of the workflow, not real data</text>
</svg>
